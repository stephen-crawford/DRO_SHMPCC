# Overlay example. Unspecified keys come from configs/default.yaml.
# Load with: yaml_config::load_experiment_config("configs/example_test.yaml")

mpc_type: sh_mpcc
horizon: 15
num_scenarios: 40
road_width: 4.0
safety_margin: 0.1
enable_contouring_constraints: true
support_cap_n_bar: 5

ego_radius: 0.5
ego_length: 1.5
num_discs: 1
max_velocity: 4.0

belief_kind: dirichlet

dro_enabled: true
risk_measure: joint_cvar
risk_scoring_model: euclidean_joint_cvar
ground_cost: w2_bures
confidence_beta: 0.05

obstacle_radius: 0.35
num_obstacles: 1
switch_regime: markov
switch_prob: 0.2
obs_modes: [constant_velocity, turn_left, turn_right, decelerating, lane_change_left, lane_change_right]
rare_mode: ""
rare_mode_probability: 0.0

environment: oncoming

rollout_steps: 200
scenario_tag: example
