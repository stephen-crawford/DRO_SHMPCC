## Ego Vehicle Model (Section IV, Eq. ego_ct / ego_dyn_rk4)
#
# State: x_ego = [p_x, p_y, theta, v, s]^T in R^5
#   - (p_x, p_y): position
#   - theta: heading
#   - v: longitudinal speed
#   - s: progress along reference path Gamma
#
# Control input: u = [a, omega]^T
#   - a: acceleration
#   - omega: angular velocity
#
# Continuous dynamics (Eq. ego_ct):
#   dot(p_x) = v*cos(theta)
#   dot(p_y) = v*sin(theta)
#   dot(theta) = omega
#   dot(v) = a
#   dot(s) = v_s
#
# Discretized via RK4 (Eq. ego_dyn_rk4)
#
# Implementation note: s is tracked externally via closest-point
# projection onto the reference path, not as an explicit state variable
# in the optimization. This is a standard MPCC implementation approach.
# The contouring/lag errors are computed from the projected s values.

## MPCC Cost (Eq. mpcc_cost)
#
# l_MPCC(k) = w_c * e_c(k)^2          (contouring error)
#           + w_l * e_l(k)^2           (lag error)
#           + w_a * a(t+k|t)^2         (acceleration penalty)
#           + w_omega * omega(t+k|t)^2 (steering penalty)
#           + w_v * (v(t+k|t) - v_ref)^2  (velocity tracking)
#
# where:
#   e_c(k) = signed distance from ego position to closest point on Gamma
#   e_l(k) = along-path deviation between s(t+k|t) and desired progress
#   Gamma is represented as a cubic spline
#
# CRITICAL: The reference path Gamma MUST be set on the controller for
# MPCC costs to be active. Without it, the solver falls back to
# point-goal tracking (minimizing ||position - goal||^2).
#
# Config weights: contour_weight (w_c), lag_weight (w_l),
#   acceleration_weight (w_a), steering_weight (w_omega),
#   velocity_weight (w_v), terminal_heading_weight

## Multi-Disc Robot Model (Eq. disc_center)
#
# D discs of radius r_d centered at offsets {c_1,...,c_D} along the
# robot's longitudinal axis:
#   p_d(k) = [p_x(k) + c_d*cos(theta(k)), p_y(k) + c_d*sin(theta(k))]
#
# Config: num_discs (D), vehicle_length, ego_radius (r_d)

## Obstacle Model (Eq. obs_dyn)
#
# Each obstacle v has finite mode set M = {1,...,M_C}
# Mode m specifies stochastic motion model:
#   x(t+1) = f_m(x(t), omega(t)),  omega ~ P_{omega,m}
#
# Available modes: constant_velocity, turn_left, turn_right,
#   decelerating, lane_change_left, lane_change_right
#
# Mode switching: Unknown, may be non-Markovian.
# Obstacles of the same class share mode observations.

## Linearized Half-Space Collision Constraints (Eq. normal, halfspace)
#
# Outward normal from disc d to obstacle v:
#   n_hat = (x_obs - p_d(k)) / max(||x_obs - p_d(k)||, eps_min)
#
# Half-space constraint:
#   n_hat^T * p_d(k) <= n_hat^T * x_obs - (r_d + r_obs + r_offset)
#
# Config: safety_margin (r_offset), obstacle_radius (r_obs)

## Mode Coverage Metrics (Section III, sec:metrics_prelim)
#
# Two diagnostics:
#   (i) Overall missed-mode rate: fraction of rollouts where at least one
#       demonstrated mode was not represented in the scenario set within N_s
#   (ii) Rare-mode miss rate: fraction where the designated rare mode
#        is not captured

## Wasserstein-DRO Mode Reweighting (Section III, Eq. w_dro_modes / w_dro_dual)
#
# For each obstacle v, compute worst-case mode distribution q* in a
# Wasserstein ball around nominal belief p_hat:
#
#   max_{q in Delta_M} <q, r>  s.t.  W_D(q, p_hat) <= rho
#
# Solved via Kantorovich dual (1D search):
#   min_{lambda>=0} { lambda*rho + sum_i p_hat_i * max_j(r_j - lambda*D_ij) }
#
# Recovery: map each nominal mass at mode i to j*(i) = argmax_j(r_j - lambda* D_ij),
# then verify induced transport plan satisfies radius constraint.
#
# Ground cost D: W2 Bures distance between mode-conditioned Gaussians
#   D[i][j] = (1/N) sum_k W2(P_i(k), P_j(k))
#   where W2^2 = ||mu_1-mu_2||^2 + Bures^2(Sigma_1, Sigma_2)
#
# Risk vector r[m] per mode (conservative Gaussian clearance surrogate):
#   n_{m,k,d} = (mu_{m,k} - c_d(k)) / ||mu_{m,k} - c_d(k)||
#   sigma_{m,k,d} = sqrt(n^T Sigma n) (directional std dev toward ego)
#   r_{m,k,d} = max(0, R + z_alpha * sigma_{m,k,d} - ||mu_{m,k} - c_d(k)||)
#   r_m = max_k<=N_s max_d<=D r_{m,k,d}
#   where R = r_ego + r_obs + margin, z_alpha = one-sided quantile
#
# Adaptive rho:
#   rho = rho_0 * (1 + alpha / sqrt(n_obs))
#   where rho_0 = base radius (default 0.1), alpha = scaling coeff (default 1.0)
#   Contracts as observations accumulate (1/sqrt(n_obs) decays → rho → rho_0)
#
# Config: enable_dro, dro_rho_base, dro_rho_min, dro_rho_max,
#   dro_adaptive_rho, dro_coverage_alpha, dro_nominal_source

## DRO Scenario Injection (Section III, "DRO scenario injection")
#
# Three injection selection rules for K deterministic constraints:
#
# 1. WDRO-K: Inject K modes with largest mass under q*.
#    Uses both risk scores r_m and transport geometry D via the
#    Wasserstein-ball constraint. Selects I_K = argmax_{|I|=K} sum_{m in I} q*_m.
#
# 2. TopRisk-K: Greedy risk-only heuristic. Inject K modes with largest
#    risk scores r_m. May select redundant modes with similar trajectories.
#
# 3. DiverseRisk-K: Risk × diversity selection.
#    m_1 = argmax_m r_m
#    m_l = argmax_{m not in S_{l-1}} (r_m * min_{s in S_{l-1}} D(m,s))
#    Trades off risk against geometric diversity using ground cost D.
#
# Constraint tightening argument: F_{S,inj} ⊆ F_S, so injection only
# shrinks the feasible set and does not alter scenario-theoretic guarantees.
# Injected scenarios are NOT counted as i.i.d. samples.
#
# Config: injection_mode, adversarial_sigma_scale

## WDRO-Sampling (Section III)
#
# Instead of injecting, resample ALL S scenarios with modes drawn from q*
# instead of p_hat. This changes the sampling distribution; Calafiore-Campi
# guarantees apply w.r.t. q* (the worst-case distribution).
# If true P lies within B_rho(p_hat), this provides distributional robustness.

## Safe Horizon (Eq. scenario_opt)
#
# Collision constraints enforced only over N_s <= N.
# N_s computed from scenario theory (Calafiore-Campi):
#   Practical: N_s = min(N, floor(S / (2*n_u)))
#   Theoretical: S >= (2/eps)*(ln(1/beta) + d) where d = N_s * n_u
#
# CRITICAL: Only i.i.d. sampled scenarios count toward S for safe horizon.
# DRO-injected scenarios are additional deterministic constraints that
# tighten the feasible set but do NOT satisfy the i.i.d. assumption
# required by Calafiore-Campi theory. They are NOT counted in S_for_sh.
#
# Risk scores r used in DRO reweighting are computed using only timesteps
# k <= N_s, aligning DRO reweighting with the certified risk horizon.
#
# Config: safe_horizon_enabled, safe_horizon_mode, safe_horizon_min

## Scenario Generation (Algorithm 1)
#
# 1. For each obstacle v, obtain nominal belief p_hat and predictions
# 2. Compute q* by Wasserstein-DRO reweighting (Eq. w_dro_modes / w_dro_dual)
# 3. Sample S i.i.d. scenarios using modes from q* and base predictor noise
# 4. (If injection mode) Add K deterministic worst-case scenario(s)
# 5. Build half-space constraints over k=1,...,N_s
# 6. Solve scenario MPCC (Eq. scenario_opt)
# 7. Apply first control u*(t|t)

## Simulation Environments (Section IV, sec:envs)
#
# Both environments: ego at (0,0), 25m S-curve path y(x) = 3*sin(2*pi*x/L)
#
# Oncoming: obstacle at 60% arc length, head-on at ~1 m/s
#   - Base collision rate ~67%, most challenging
#   - 4 common modes + rare lane-change mode
#
# Intersection: obstacle 2m off-path at 40% arc length, perpendicular ~1 m/s
#   - Base collision rate ~4-7%, sensitive to mode coverage
#   - Cross/stop/turn ambiguity

## Paper Research Questions (Section V)
#
# Q1: Does WDRO-sampling improve mode coverage at fixed scenario budget?
# Q2: Does WDRO injection improve safety, and when does WDRO outperform
#     simpler TopRisk and DiverseRisk injection?
# Q3: Is performance robust against short mode history lengths?
# Q4: How sensitive are results to the transport ground cost choice?

