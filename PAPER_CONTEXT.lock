#
# V.B Challenging Interaction Settings (sec:res_env_variants):
#   Five environment variants: Crossing, Diagonal, Mixed (2 obs),
#     Mixed (3 obs), Dense (4 obs)
#   Methods: same as V.A
#   → Figure 2: fig_g6_challenging_envs (paper_figures/)
#   Data: g6_challenging_envs.csv from test_generalization g6
#
# V.C Injection-Mode Selection Comparison (sec:res_injection_comparison):
#   WDRO-K vs TopRisk-K across environments, injection counts,
#   switching probabilities, and noise thresholds.
#   Finding: statistically similar performance — principal benefit
#   comes from adding explicit coverage, not the selection heuristic.
#   (Currently text-only, no dedicated figure)
#
# V.D Interpretation (sec:res_interpretation):
#   Summary of mechanism: WDRO improves finite-sample representation
#   of risky switching behaviors under fixed scenario budget.
#   (Text-only discussion)

