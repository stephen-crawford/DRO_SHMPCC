## Ego Vehicle Model (Section IV.A)
#
# Discretized second-order unicycle:
#   x_{t+1}^ego = f^ego(x_t^ego, u_t)
#
# State: x_ego = [p_x, p_y, theta, v, s]^T in R^5
#   - (p_x, p_y): position
#   - theta: heading
#   - v: longitudinal speed
#   - s: progress along reference path Gamma
#
# Control input: u = [a, omega]^T
#   - a: acceleration
#   - omega: angular velocity
#
# Discretized via RK4 (mentioned in Section V setup)
#
# Implementation note: s is tracked externally via closest-point
# projection onto the reference path, not as an explicit state variable
# in the optimization. This is a standard MPCC implementation approach.

## MPCC Cost (Eq. mpcc_cost, Section IV.A)
#
# l_MPCC(k) = w_c * e_c(k)^2          (contouring error)
#           + w_l * e_l(k)^2           (lag error)
#           + w_a * a(t+k|t)^2         (acceleration penalty)
#           + w_omega * omega(t+k|t)^2 (steering penalty)
#           + w_v * (v(t+k|t) - v_ref)^2  (velocity tracking)
#
# where w_c, w_l, w_a, w_omega, w_v > 0 are user-specified weights
# and v_ref is a reference velocity.
#
# CRITICAL: The reference path Gamma MUST be set on the controller for
# MPCC costs to be active. Without it, the solver falls back to
# point-goal tracking.
#
# Config weights: contour_weight (w_c), lag_weight (w_l),
#   acceleration_weight (w_a), steering_weight (w_omega),
#   velocity_weight (w_v), terminal_heading_weight

## Multi-Disc Robot Model (Eq. disc_center, Section IV.A)
#
# D discs of radius r_d centered at offsets {c_1,...,c_D} along the
# robot's longitudinal axis:
#   p_d(k) = [p_x(k) + c_d*cos(theta(k)), p_y(k) + c_d*sin(theta(k))]
#
# Config: num_discs (D), vehicle_length, ego_radius (r_d)

## Obstacle Model (Eq. obs_dyn, Section IV.A)
#
# Each obstacle v in {1,...,V} belongs to class C(v) with finite mode
# set M_C = {1,...,M_C}. Mode m specifies a stochastic motion model:
#   x_{t+1}^v = f_m(x_t^v)
#
# Mode evolution is unknown and may be non-Markovian.
# Nominal belief: p_hat_t^v in Delta_{M_C}
#
# Available modes: constant_velocity, turn_left, turn_right,
#   decelerating, lane_change_left, lane_change_right
# Obstacles of the same class share mode observations.

## Linearized Half-Space Collision Constraints (Eq. normal, halfspace)
#
# Outward normal from disc d to obstacle v at step k, scenario i:
#   n_hat = (x_obs^{v,(i)}_{t+k|t} - p_d(k)) / max(||...||, eps_min)
#
# Half-space constraint:
#   n_hat^T * p_d(k) <= n_hat^T * x_obs - (r_d + r_obs + r_offset)
#
# Enforced for all d=1..D, v=1..V, k=1..N_s, i=1..S_tot
# Config: safety_margin (r_offset), obstacle_radius (r_obs)

## Safe Horizon (Eq. scenario_opt, Section IV.A)
#
# Collision constraints enforced only over N_s <= N.
# Baseline SH-MPCC scenario program:
#   min_{U_t in U^N} sum_{k=0}^{N-1} l_MPCC(k)
#   s.t. ego dynamics, collision constraints over k=1..N_s for all scenarios
#
# CRITICAL: Only i.i.d. sampled scenarios count toward S for safe horizon.
# DRO-injected scenarios are additional deterministic constraints that
# tighten the feasible set but do NOT satisfy the i.i.d. assumption
# required by Calafiore-Campi theory.
#
# Config: safe_horizon_enabled, safe_horizon_mode, safe_horizon_min

## Wasserstein-DRO Mode Reweighting (Eq. w_dro_modes / w_dro_dual, Section IV.B)
#
# For each obstacle v, compute worst-case mode distribution q* in a
# Wasserstein ball around nominal belief p_hat:
#
#   max_{q in Delta_M} <q, r>  s.t.  W_D(q, p_hat) <= rho
#
# where r in R^M is a per-mode danger score, W_D is the discrete
# Wasserstein distance induced by ground cost D, rho is the radius.
#
# Adaptive rho:
#   rho = rho_0 * (1 + alpha / sqrt(n_obs))
#   rho_0 = 0.1 (default), alpha = 1.0 (default)
#   Contracts as observations accumulate.
#
# Risk vector r[m] per mode (conservative Gaussian clearance surrogate):
#   n_{m,k,d} = (mu_{m,k} - c_d(k)) / ||mu_{m,k} - c_d(k)||
#   sigma_{m,k,d} = sqrt(n^T Sigma n) (directional std dev)
#   r_{m,k,d} = max(0, R + z_alpha * sigma_{m,k,d} - ||mu_{m,k} - c_d(k)||)
#   r_m = max_k<=N_s max_d<=D r_{m,k,d}
#   where R = r_d + r_obs + r_offset
#
# Kantorovich dual (1D convex minimization):
#   min_{lambda>=0} { lambda*rho + sum_i p_hat_i * max_j(r_j - lambda*D_ij) }
#
# Recovery: map each nominal mass at mode i to j*(i) = argmax_j(r_j - lambda* D_ij),
# verify induced transport plan satisfies radius constraint.
#
# Key property: p_hat is always feasible (W_D(p_hat, p_hat) = 0 <= rho),
# so <q*, r> >= <p_hat, r>. q* is a conservative mode distribution.
#
# Ground cost D: W2 Bures distance between mode-conditioned Gaussians
#   D[i][j] = (1/N) sum_k W2(P_i(k), P_j(k))
#
# Config: enable_dro, dro_rho_base, dro_rho_min, dro_rho_max,
#   dro_adaptive_rho, dro_coverage_alpha, dro_nominal_source

## WDRO-Based Scenario Injection (Section IV.C)
#
# After computing q*, select K modes with largest WDRO mass:
#   I_K subset M_C, |I_K| = K
#   I_K in argmax_{|I|=K} sum_{l in I} q*_l
#
# Inject their deterministic representatives (mode-conditioned mean
# trajectories) as additional collision-avoidance constraints.
#
# Constraint tightening: F_{S,inj} ⊆ F_S
# Injected constraints are NOT i.i.d. samples; they act as a
# deterministic tightening layer on top of the S sampled constraints.
#
# Config: injection_mode, adversarial_sigma_scale

## Three Controller Variants (Section IV.D)
#
# 1. Base SH-MPCC: modes sampled from p_hat
# 2. WDRO-sampling: modes sampled from q* instead of p_hat
# 3. WDRO-K injection: S scenarios from p_hat + K deterministic
#    mode representatives injected as tightening constraints
#
# Baseline comparison:
# - TopRisk-K: selects injected modes greedily by risk score only
#   (empirical baseline, not part of main method)

## Evaluation Metrics (Section V)
#
# Three primary metrics:
#   1. Collision rate
#   2. Missed-mode rate (fraction of rollouts where at least one
#      demonstrated mode was not represented in scenario set within N_s)
#   3. Mean clearance
#
# Hypothesis: when scenario budget is fixed, improving which modes are
# represented should reduce missed modes and improve safety.

## Paper Experiments (Section V)
#
# Two experiment groups:
#
# V.A Path Geometry Comparison (sec:res_geometry):
