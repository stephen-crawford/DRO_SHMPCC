## Figure Output Directory Convention
#
# All generated figures and CSV data MUST be written to ./figures/<subfolder>/
# where <subfolder> corresponds to the test/experiment type:
#
#   figures/generalization/       - Generalization experiments (G1-G8)
#   figures/generalization_figures/ - Generated figures from generalization data
#   figures/paper/                - Core paper figures
#   figures/robustness/           - Robustness experiments
#   figures/focused_figures/      - Focused diagnostic figures
#   paper_figures/                - Final paper-ready figures referenced in .tex
#
# Tests set OUTPUT_DIR = "figures/<subfolder>/" and call
# fs::create_directories(OUTPUT_DIR) before writing.
# Python scripts set OUT = pathlib.Path("figures/<subfolder>").
#
# The .tex file references figures from paper_figures/ directory.
