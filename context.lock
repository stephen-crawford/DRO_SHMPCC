## mode_weights.hpp / mode_weights.cpp (small + 248 lines)
#
# compute_mode_weights(history, weight_type, decay, timestep)
#   Returns {mode_id -> weight} normalized to sum 1.
#
# Weight strategies:
#   UNIFORM:        w_m = 1/M
#   FREQUENCY:      w_m = count_m / total
#   RECENCY:        w_m ~ sum lambda^(T-t) * 1{mode_t = m}
#   WASSERSTEIN:    0.3*freq + 0.7*recency (decay=0.85)
#                   NOTE: This is NOT a Sinkhorn OT solver.
#   TEMPERATURE:    w'_m = exp(ln w_m / T), T=0.5
#   EPSILON_GREEDY: w'_m = (1-eps)*w_m + eps/M, eps=0.3
#
# Observation gate: modes with zero observations get weight 0.
# Cold-start: no observations -> returns empty map.

## scenario_sampler.hpp / scenario_sampler.cpp (180 + 654 lines)
#
# Scenario generation from mode weights.
#
# sample_scenarios(...)             -- Standard categorical sampling
# sample_scenarios_with_mode_coverage(...) -- Phase 1: one per mode;
#                                            Phase 2: fill from weights
# sample_scenarios_with_weights(...) -- Use externally provided weights
#
# Trajectory generation per scenario per obstacle:
#   1. Sample mode m ~ Categorical(w)
#   2. For k=0..N-1: draw w_k ~ N(0,I), propagate x_{k+1} = A_m*x_k + b_m + G_m*w_k
#   3. Record PredictionStep with mean and growing covariance
#
# Stationary fallback: make_stationary_trajectory() for unobserved obstacles.

## collision_constraints.hpp / collision_constraints.cpp (172 + 369 lines)
#
# Linearized half-space collision constraints.
#
# Normal: n_hat = (x_obs - p_d(k)) / max(||x_obs - p_d(k)||, eps_min)
# Constraint: n_hat^T * p_d(k) <= n_hat^T * x_obs - (r_d + r_obs + margin)
#
# Multi-disc support: D discs at offsets along ego longitudinal axis.
#   p_d(k) = [p_x(k) + c_d*cos(theta(k)), p_y(k) + c_d*sin(theta(k))]
#
# check_collision() -- Post-hoc collision validation for diagnostics.

## qp_solver.hpp / qp_solver.cpp (95 + 151 lines)
#
# ADMM-based QP solver.
# Problem: min_z 0.5*z^T*H*z + g^T*z  s.t.  C*z >= d
# Condensed QP: eliminates state variables, constrains only controls.

## wasserstein_dro.hpp / wasserstein_dro.cpp (450 + 1088 lines)
#
# Core innovation. WassersteinDRO class.
#
# Kantorovich dual solver:
#   sup_q sum_m q_m*r_m  s.t.  W_D(q, p_hat) <= rho
#   = inf_{lambda>=0} { lambda*rho + sum_i p_hat_i * max_j(r_j - lambda*D_ij) }
#
# Key methods:
#   compute_worst_case_weights(nominal, obs_state, modes, ref_traj,
#                              ..., safe_horizon, ...)
#     -> DROResult with worst-case weights q*, lambda*, risk vector
#   generate_worst_case_scenario(...)
#     -> Inject mean trajectory of argmax_m q*_m
#   generate_adversarial_scenario(...)
#     -> Inject tail trajectory (mean + sigma_scale * directional sigma)
#
# Risk computation:
#   r_m = max_{k<=N_s} max_{d<=D} r_{m,k,d}
#   r_{m,k,d} = max(0, R + z_alpha*sigma_{m,k,d} - ||mu_{m,k} - c_d(k)||)
#   sigma_{m,k,d} = sqrt(n^T * Sigma * n)  (directional std dev)
#
# Ground cost matrix:
#   D[i][j] = (1/N) sum_k W2(P_i(k), P_j(k))  (W2-Bures by default)
#   Alternative: ZERO_ONE, EUCLIDEAN_MEAN
#
# Adaptive rho: rho = rho_0 * (1 + alpha / sqrt(n_obs))
#
# DRO risk modes: FULL, NO_COV, DISTANCE_ONLY
# Injection selection: WDRO-K, TopRisk-K, DiverseRisk-K

## mpc_controller.hpp / mpc_controller.cpp (267 + 1518 lines)
#
# AdaptiveScenarioMPC -- Main controller. Algorithm 2 implementation.
#
# Public API:
#   initialize_obstacle(id, class, modes)
#   update_mode_observation(id, class, mode, timestep)
#     -> Broadcasts to class siblings for shared observations
#   solve(ego_state, obstacles, goal, v_ref, path_progress, path_length)
#   set_reference_path(path) -- Enable MPCC costs
#   set_custom_mode_weights(obstacle_id, weights)
#
# Solve pipeline (per call):
#   1. Initialize reference trajectory (warmstart or straight-line)
#   2. Sample scenarios (standard, mode-coverage, or custom weights)
#   3. DRO injection (if enabled): compute q*, inject scenario(s)
#   4. Safe horizon truncation (if enabled)
#   5. SQP loop + ADMM QP solve
#   6. Prune inactive scenarios
#   7. Return first control
#
# Members:
#   WassersteinDRO dro_              -- DRO module (if enable_dro=true)
#   map<int, ModeHistory> mode_histories_
#   map<int, int> obstacle_classes_  -- Class assignments
#   vector<Scenario> scenarios_
#   ReferencePath reference_path_

