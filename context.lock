# =============================================================================
# KEY ALGORITHMS
# =============================================================================

## Algorithm 1: Scenario Generation with DRO
# 1. Compute nominal mode distribution p_hat from observations
# 2. Solve Wasserstein DRO: max_{q in B_rho(p_hat)} sum_m q_m*r_m
# 3. Sample S scenarios from q* (or p_hat) depending on injection mode
# 4. Inject K worst-case scenarios (deterministic)
# 5. Build constraints over k=1,...,N_s

## Algorithm 2: AdaptiveScenarioMPC (mpc_controller.cpp)
# 1. Mode observation update -> broadcast to class siblings
# 2. Reference trajectory warmstart
# 3. Scenario sampling (standard, mode-coverage, or custom weights)
# 4. DRO injection (if enabled)
# 5. Safe horizon truncation
# 6. SQP + ADMM QP solve
# 7. Prune inactive scenarios
# 8. Return first control u*(t|t)

## Algorithm 3: Scenario Pruning
# Remove scenarios that violate collision constraints at current state.

## Algorithm 4: Mode-Coverage Sampler
# Phase 1: Force one scenario per observed mode (coverage guarantee)
# Phase 2: Fill remaining budget from weighted distribution

