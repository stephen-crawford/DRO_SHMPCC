## types.hpp (371 lines)
#
# Foundation data structures. All structs map to paper concepts.
#
# EgoState          -- [x, y, theta, v] position, heading, speed
# EgoInput          -- [a, delta] acceleration, steering rate
# ObstacleState     -- [x, y, vx, vy] position and velocity
# ModeModel         -- Linear dynamics: x_{k+1} = A*x_k + b + G*w_k
# ModeHistory       -- Per-obstacle observation log: [(timestep, mode_id)]
#                      Tracks obstacle_class for class-based sharing
# PredictionStep    -- Single timestep: mean position + covariance
# ObstacleTrajectory-- Full horizon prediction for one obstacle under one mode
# Scenario          -- Joint scenario: {obstacle_id -> ObstacleTrajectory}
#                      Has is_injected flag for DRO-injected scenarios
# CollisionConstraint -- Linearized half-plane a^T*p >= b at timestep k
# MPCResult         -- Optimization output: trajectory, inputs, cost,
#                      solve_time, safe_horizon, success flag
#
# Enums:
#   WeightType: UNIFORM, FREQUENCY, RECENCY, WASSERSTEIN,
#               TEMPERATURE, EPSILON_GREEDY
#   InjectionMode: NONE, DRO, QSTAR_SAMPLE, ADVERSARIAL, RANDOM,
#                  ALL_MODES, UNIFORM_COVERAGE, SOFTMAX_RISK,
#                  EPSILON_GREEDY_INJ, TOP_RISK_INJECT, DIVERSE_RISK_INJECT
#   SafeHorizonMode: THEORETICAL_TIGHT, THEORETICAL_SIMPLE, PRACTICAL
#   DROGroundCostType: W2_BURES, ZERO_ONE, EUCLIDEAN_MEAN

