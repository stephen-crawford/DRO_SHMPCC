## reference_path.hpp / reference_path.cpp (164 + 242 lines)
#
# ReferencePath -- Cubic spline representation of reference path.
#   find_closest_point(position, hint) -- Arc-length projection
#   get_position_at(s) -- 2D position from arc-length
#   get_orientation_at(s) -- Heading angle
#   create_s_curve(length, amplitude, points) -- S-curve: y = A*sin(2*pi*x/L)
#
# Used for MPCC contouring/lag cost computation.
